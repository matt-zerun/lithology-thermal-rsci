[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lithology-thermal-rsci"
version = "2.0.1"
description = "Lithology-specific thermal-conductivity response surfaces and RSCI diagnostics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [
  {name = "Mateusz Żeruń"}
]
keywords = [
  "thermal conductivity",
  "mineral soils",
  "engineering geology",
  "response surfaces",
  "grouped cross-validation",
  "RSCI"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11.1,<1.17",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "pygam>=0.12,<0.13",
  "joblib>=1.3,<2",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7"
]

[project.scripts]
lithology-thermal-run = "lithology_thermal_rsci.cli:main"

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.21682909"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lithology_thermal_rsci = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
